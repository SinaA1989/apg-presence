name: APG Presence Verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify owner proof (required only when populated)
        run: |
          node -e "const p=require('./presence/proof.json'); if(p.message===null && p.signature===null) {console.log('PENDING OWNER SIGNATURE; NOT VERIFIED');process.exit(0)}"
          if node -e "const p=require('./presence/proof.json');process.exit(p.message===null && p.signature===null?0:1)"; then exit 0; fi
          npm run verify
