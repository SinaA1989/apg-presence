name: APG Presence Verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Reproduce bounded Genesis Mirror claims from committed evidence
        run: npm run verify:genesis-mirror:fixture
      - name: Validate committed proof state
        run: npm run verify:ci
